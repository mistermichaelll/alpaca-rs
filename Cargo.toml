[package]
name = "alpaca-rs"
version = "0.0.1"
edition = "2024"

[dependencies]
jiff = {version = "0.2.35", features = ["serde"]}
reqwest = {version = "0.13.4", features = ["json", "query"]}
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
dotenvy = "0.15.7"